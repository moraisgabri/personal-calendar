# Radicale configuration for the Calendar Server in the `calendar-server` qube.
# Everything lives under /home/user so it persists across qube restarts.
# The secrets referenced here are generated on the qube by make_secrets.py
# and never committed.

[server]
# Listen on all addresses: other qubes reach this one over the Qubes network.
hosts = 0.0.0.0:5232
# HTTPS only. A plain HTTP request fails the TLS handshake and is not served.
ssl = True
certificate = /home/user/radicale/secrets/server.crt
key = /home/user/radicale/secrets/server.key

[auth]
type = htpasswd
htpasswd_filename = /home/user/radicale/secrets/users
htpasswd_encryption = bcrypt
# Slow down password guessing.
delay = 1

[rights]
# The Owner can only reach their own collections.
type = owner_only

[storage]
# The Calendar as plain files.
filesystem_folder = /home/user/radicale/collections

[web]
# No web interface (out of scope).
type = none
