# vdirsyncer configuration for a Calendar Qube. install.sh writes it to
# ~/.config/vdirsyncer/config, replacing @SERVER@ with the Calendar Server's
# address. That address is the only difference between Calendar Qubes.

[general]
status_path = "~/.local/share/vdirsyncer/status/"

[pair calendar]
a = "calendar_local"
b = "calendar_server"
# The one Calendar, not every collection the Owner might have.
collections = null
# No conflict_resolution: when the same event was edited on two Devices,
# the sync stops for that event and reports it instead of overwriting one.

[storage calendar_local]
# The local copy khal reads and writes, so the Calendar works offline.
type = "filesystem"
path = "~/.local/share/calendar/events/"
fileext = ".ics"

[storage calendar_server]
type = "caldav"
url = "@SERVER@owner/calendar/"
username = "owner"
password.fetch = ["command", "cat", "~/.config/vdirsyncer/password"]
# Trust only the Calendar Server's own self-signed certificate.
verify = "~/.config/vdirsyncer/server.crt"
