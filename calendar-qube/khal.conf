# khal configuration for a Calendar Qube, installed as ~/.config/khal/config.
# khal reads and writes the local copy that vdirsyncer keeps in Sync.

[calendars]
[[calendar]]
path = ~/.local/share/calendar/events/
type = calendar

[default]
default_calendar = calendar

[locale]
timeformat = %H:%M
dateformat = %Y-%m-%d
longdateformat = %Y-%m-%d
datetimeformat = %Y-%m-%d %H:%M
longdatetimeformat = %Y-%m-%d %H:%M
